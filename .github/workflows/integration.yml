name: Integration

on:
  # Opt-in paid CI on ONE exact branch/commit; normal pushes never call providers.
  # To run, push one verified commit with message prefix [v1-gate].
  # A normal push with all jobs skipped is NOT Hosted E2E acceptance evidence.
  # Run the gated matrix only after the head commit has passed the regular Go CI.
  push:
    branches:
      - test/v1-integrated-acceptance
  workflow_dispatch:
    inputs:
      run_trading:
        description: "Run the Trading Agent integration test"
        required: true
        default: false
        type: boolean
      run_technical:
        description: "Run the real Technical Agent integration test"
        required: true
        default: false
        type: boolean
      run_research:
        description: "Run the full stateless production Research → Decision pipeline"
        required: true
        default: false
        type: boolean
      run_multi_agent:
        description: "Run the full multi-agent Research → Debate → Manager → Trading pipeline"
        required: true
        default: false
        type: boolean
      run_risk_portfolio:
        description: "Run internal Risk / Portfolio hosted E2E (legacy integration fixture)"
        required: true
        default: false
        type: boolean
      run_fundamental:
        description: "Run production CLI with real Fundamental Analyst and PIT-safe Tushare income data"
        required: true
        default: false
        type: boolean
      run_live_web_api:
        description: "Paid real Go HTTP ResearchRun and Eino provider E2E"
        required: true
        default: false
        type: boolean
      run_production_cli:
        description: "Run actual cmd/aegis Portfolio Review CLI end-to-end"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  trading:
    name: Trading Agent
    if: ${{ inputs.run_trading || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[v1-gate]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      AEGIS_INTEGRATION: "1"
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      DEEPSEEK_STRONG_MODEL: ${{ vars.DEEPSEEK_STRONG_MODEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ripgrep for research grep tool
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ripgrep
          command -v rg
          rg --version

      - name: Verify integration secret
        shell: bash
        run: |
          test -n "$DEEPSEEK_API_KEY" || {
            echo "::error::Repository secret DEEPSEEK_API_KEY is required"
            exit 1
          }

      - name: Run Trading Agent integration
        run: |
          go test ./internal/agent/trading \
            -run '^TestTradingAgent_Analyze_Integration$' \
            -v \
            -count=1

  technical:
    name: Technical Agent
    if: ${{ inputs.run_technical || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[v1-gate]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      AEGIS_INTEGRATION: "1"
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ripgrep for research grep tool
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ripgrep
          command -v rg
          rg --version


      - name: Verify integration secrets
        shell: bash
        run: |
          test -n "$DEEPSEEK_API_KEY" || {
            echo "::error::Repository secret DEEPSEEK_API_KEY is required"
            exit 1
          }
          test -n "$TUSHARE_TOKEN" || {
            echo "::error::Repository secret TUSHARE_TOKEN is required"
            exit 1
          }


      - name: Run Technical Agent integration
        run: |
          go test ./internal/agent/technical \
            -run '^TestTechnicalAgent_Analyze_Integration$' \
            -v \
            -count=1

  research:
    name: Full Stateless Hosted E2E
    if: ${{ inputs.run_research || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[v1-gate]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AEGIS_INTEGRATION: "1"
      AEGIS_FULL_STATELESS_E2E: "1"
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      DEEPSEEK_STRONG_MODEL: ${{ vars.DEEPSEEK_STRONG_MODEL }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ripgrep for research grep tool
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ripgrep
          command -v rg
          rg --version


      - name: Verify full E2E secrets
        shell: bash
        run: |
          test -n "$DEEPSEEK_API_KEY" || { echo "::error::Repository secret DEEPSEEK_API_KEY is required"; exit 1; }
          test -n "$TUSHARE_TOKEN" || { echo "::error::Repository secret TUSHARE_TOKEN is required"; exit 1; }
          test -n "$TAVILY_API_KEY" || { echo "::error::Repository secret TAVILY_API_KEY is required"; exit 1; }


      - name: Run full stateless hosted pipeline
        run: |
          go test ./internal/research             -run '^TestWorkflow_Run_FullStatelessHostedIntegration$'             -v             -count=1


  multi_agent:
    name: Full Multi-Agent Hosted E2E
    if: ${{ inputs.run_multi_agent || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[v1-gate]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      AEGIS_FULL_MULTI_AGENT_E2E: "1"
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      DEEPSEEK_STRONG_MODEL: ${{ vars.DEEPSEEK_STRONG_MODEL }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ripgrep for research grep tool
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ripgrep
          command -v rg
          rg --version

      - name: Verify multi-agent E2E secrets
        shell: bash
        run: |
          test -n "$DEEPSEEK_API_KEY" || { echo "::error::Repository secret DEEPSEEK_API_KEY is required"; exit 1; }
          test -n "$TUSHARE_TOKEN" || { echo "::error::Repository secret TUSHARE_TOKEN is required"; exit 1; }
          test -n "$TAVILY_API_KEY" || { echo "::error::Repository secret TAVILY_API_KEY is required"; exit 1; }

      - name: Run full multi-agent hosted pipeline
        run: |
          go test ./internal/research \
            -run '^TestWorkflow_Run_FullMultiAgentHostedIntegration$' \
            -v \
            -count=1


  risk_portfolio:
    name: Full Risk / Portfolio Hosted E2E
    if: ${{ inputs.run_risk_portfolio || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[v1-gate]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      AEGIS_FULL_MULTI_AGENT_E2E: "1"
      AEGIS_FULL_RISK_PORTFOLIO_E2E: "1"
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      DEEPSEEK_STRONG_MODEL: ${{ vars.DEEPSEEK_STRONG_MODEL }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ripgrep for research grep tool
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ripgrep
          command -v rg
          rg --version

      - name: Verify risk portfolio E2E secrets
        shell: bash
        run: |
          test -n "$DEEPSEEK_API_KEY" || { echo "::error::Repository secret DEEPSEEK_API_KEY is required"; exit 1; }
          test -n "$TUSHARE_TOKEN" || { echo "::error::Repository secret TUSHARE_TOKEN is required"; exit 1; }
          test -n "$TAVILY_API_KEY" || { echo "::error::Repository secret TAVILY_API_KEY is required"; exit 1; }

      - name: Run full hosted risk portfolio pipeline
        run: |
          go test ./internal/research \
            -run '^TestWorkflow_Run_FullMultiAgentHostedIntegration$' \
            -v \
            -count=1

  production_cli:
    name: Production CLI Portfolio Review E2E
    if: ${{ inputs.run_production_cli || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[v1-gate]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ripgrep for research grep tool
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ripgrep
          command -v rg
          rg --version

      - name: Verify production dependencies
        shell: bash
        run: |
          for key in DEEPSEEK_API_KEY TUSHARE_TOKEN TAVILY_API_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::Repository secret $key is required"
              exit 1
            fi
          done
          test -f configs/config.yaml || { echo "::error::Missing production config"; exit 1; }
          test -s skills/tushare-data/SKILL.md || {
            echo "::error::Production Tushare Skill is missing from this checked-out branch; merge main's skills/ files"
            exit 1
          }
          command -v jq || { echo "::error::jq required"; exit 1; }

      - name: Build actual application
        run: go build -o "${{ runner.temp }}/aegis" ./cmd/aegis

      - name: Run CLI with explicit unknown account
        shell: bash
        env:
          OUTPUT_JSON: ${{ runner.temp }}/portfolio-decision.json
          ACCOUNT_JSON: ${{ runner.temp }}/portfolio-context.json
        run: |
          set -euo pipefail
          printf '{"state":"NOT_PROVIDED"}\n' > "$ACCOUNT_JSON"
          chmod 600 "$ACCOUNT_JSON"
          # Do not use fabricated positions, cash, NAV, exposure or budgets.
          # This invokes the *same production entrypoint* users run.
          "${{ runner.temp }}/aegis" \
            -config configs/config.yaml \
            -skills skills \
            -symbol 600519.SH \
            -portfolio-review \
            -portfolio-file "$ACCOUNT_JSON" \
            -evidence-store "${{ runner.temp }}/evidence" \
            > "$OUTPUT_JSON"

      - name: Validate production JSON contract
        shell: bash
        env:
          OUTPUT_JSON: ${{ runner.temp }}/portfolio-decision.json
        run: |
          set -euo pipefail
          jq -e '
            .research_artifact.symbol == "600519.SH" and
            .portfolio_review.trade_intent.symbol == "600519.SH" and
            .portfolio_review.risk_context.symbol == "600519.SH" and
            .portfolio_review.portfolio_decision.symbol == "600519.SH" and
            .final_risk_gate.disposition == .portfolio_review.portfolio_decision.disposition and
            .final_risk_gate.reason == "PORTFOLIO_DECISION" and
            (.final_risk_gate | has("policy_id") | not) and
            .portfolio_review.risk_context.assessment == "INSUFFICIENT_CONTEXT" and
            .portfolio_review.portfolio_decision.portfolio_state == "NOT_PROVIDED" and
            (.portfolio_review.debate_state.turns | map(.side) | index("BULL")) != null and
            (.portfolio_review.debate_state.turns | map(.side) | index("BEAR")) != null and
            (.portfolio_review.debate_state.turns | length) == 4 and
            (.portfolio_review.debate_state.turns | map(.side)) == ["BULL","BEAR","BULL","BEAR"] and
            (
              .portfolio_review.debate_state.turns as $turns |
              all(range(1;4); . as $i |
                [$turns[:$i][] | select(.side != $turns[$i].side) | .arguments[] | .id] as $opposing |
                any($turns[$i].rebuttals[]?; .target_argument_id as $target | $opposing | index($target) != null)
              )
            ) and
            (
              if .portfolio_review.trade_intent.status == "CANDIDATE" then
                .portfolio_review.portfolio_decision.disposition == "REVIEW_REQUIRED"
              elif (.portfolio_review.trade_intent.status == "MONITOR" or
                    .portfolio_review.trade_intent.status == "REJECTED") then
                .portfolio_review.portfolio_decision.disposition == "NO_ACTION"
              else false end
            ) and
            (.portfolio_review.portfolio_decision | has("order") | not)
          ' "$OUTPUT_JSON" >/dev/null
          echo "Production CLI returned a validated non-executable PortfolioDecision"
          echo "Final statuses (no research contents or account data printed):"
          jq -c '{
            symbol: .portfolio_review.portfolio_decision.symbol,
            intent: .portfolio_review.trade_intent.status,
            risk: .portfolio_review.risk_context.assessment,
            disposition: .portfolio_review.portfolio_decision.disposition,
            portfolio_state: .portfolio_review.portfolio_decision.portfolio_state
          }' "$OUTPUT_JSON"

  fundamental_cli:
    name: Fundamental Production CLI E2E
    if: ${{ inputs.run_fundamental || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[v1-gate]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ripgrep for research grep tool
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ripgrep
          command -v rg
          rg --version

      - name: Verify production dependencies
        shell: bash
        run: |
          for key in DEEPSEEK_API_KEY TUSHARE_TOKEN TAVILY_API_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::Repository secret $key is required"
              exit 1
            fi
          done
          test -f configs/config.yaml || { echo "::error::Missing production config"; exit 1; }
          test -s skills/tushare-data/SKILL.md || {
            echo "::error::Production Tushare Skill is missing from this checked-out branch; merge main's skills/ files"
            exit 1
          }
          command -v jq || { echo "::error::jq required"; exit 1; }

      - name: Build actual application
        run: go build -o "${{ runner.temp }}/aegis" ./cmd/aegis

      - name: Run CLI with explicit unknown account
        shell: bash
        env:
          OUTPUT_JSON: ${{ runner.temp }}/portfolio-decision.json
          ACCOUNT_JSON: ${{ runner.temp }}/portfolio-context.json
        run: |
          set -euo pipefail
          printf '{"state":"NOT_PROVIDED"}\n' > "$ACCOUNT_JSON"
          chmod 600 "$ACCOUNT_JSON"
          # Do not use fabricated positions, cash, NAV, exposure or budgets.
          # This invokes the *same production entrypoint* users run.
          "${{ runner.temp }}/aegis" \
            -config configs/config.yaml \
            -skills skills \
            -symbol 600519.SH \
            -portfolio-review \
            -fundamental \
            -portfolio-file "$ACCOUNT_JSON" \
            -evidence-store "${{ runner.temp }}/evidence" \
            > "$OUTPUT_JSON"

      - name: Validate production JSON contract
        shell: bash
        env:
          OUTPUT_JSON: ${{ runner.temp }}/portfolio-decision.json
        run: |
          set -euo pipefail
          jq -e '
            .research_artifact.symbol == "600519.SH" and
            .research_artifact.fundamental.symbol == "600519.SH" and
            .research_artifact.fundamental.income.symbol == "600519.SH" and
            .research_artifact.fundamental.income.source == "TUSHARE_INCOME" and
            (.research_artifact.fundamental.interpretation | length > 0) and
            .portfolio_review.trade_intent.symbol == "600519.SH" and
            .portfolio_review.risk_context.symbol == "600519.SH" and
            .portfolio_review.portfolio_decision.symbol == "600519.SH" and
            .final_risk_gate.disposition == .portfolio_review.portfolio_decision.disposition and
            .final_risk_gate.reason == "PORTFOLIO_DECISION" and
            (.final_risk_gate | has("policy_id") | not) and
            .portfolio_review.risk_context.assessment == "INSUFFICIENT_CONTEXT" and
            .portfolio_review.portfolio_decision.portfolio_state == "NOT_PROVIDED" and
            (.portfolio_review.debate_state.turns | map(.side) | index("BULL")) != null and
            (.portfolio_review.debate_state.turns | map(.side) | index("BEAR")) != null and
            (.portfolio_review.debate_state.turns | length) == 4 and
            (.portfolio_review.debate_state.turns | map(.side)) == ["BULL","BEAR","BULL","BEAR"] and
            (
              .portfolio_review.debate_state.turns as $turns |
              all(range(1;4); . as $i |
                [$turns[:$i][] | select(.side != $turns[$i].side) | .arguments[] | .id] as $opposing |
                any($turns[$i].rebuttals[]?; .target_argument_id as $target | $opposing | index($target) != null)
              )
            ) and
            (
              if .portfolio_review.trade_intent.status == "CANDIDATE" then
                .portfolio_review.portfolio_decision.disposition == "REVIEW_REQUIRED"
              elif (.portfolio_review.trade_intent.status == "MONITOR" or
                    .portfolio_review.trade_intent.status == "REJECTED") then
                .portfolio_review.portfolio_decision.disposition == "NO_ACTION"
              else false end
            ) and
            (.portfolio_review.portfolio_decision | has("order") | not)
          ' "$OUTPUT_JSON" >/dev/null
          echo "Production CLI returned a validated non-executable PortfolioDecision"
          echo "Final statuses (no research contents or account data printed):"
          jq -c '{
            symbol: .portfolio_review.portfolio_decision.symbol,
            intent: .portfolio_review.trade_intent.status,
            risk: .portfolio_review.risk_context.assessment,
            disposition: .portfolio_review.portfolio_decision.disposition,
            portfolio_state: .portfolio_review.portfolio_decision.portfolio_state
          }' "$OUTPUT_JSON"

  invalid_account_cli:
    name: Production CLI Invalid Account Fail-Closed
    if: ${{ inputs.run_production_cli || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[v1-gate]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No provider credentials: rejection must happen before model/source setup.
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build actual CLI
        run: go build -o "${{ runner.temp }}/aegis" ./cmd/aegis
      - name: Reject malformed account before external research
        shell: bash
        env:
          CLI: ${{ runner.temp }}/aegis
          ACCOUNT_JSON: ${{ runner.temp }}/bad-account.json
          OUTPUT_JSON: ${{ runner.temp }}/unexpected-output.json
          STDERR_LOG: ${{ runner.temp }}/validation-error.log
        run: |
          set -euo pipefail
          printf '{"state":"POSITIONS","positions":[],"unknown_property":true}\n' > "$ACCOUNT_JSON"
          if "$CLI" -config configs/config.yaml -skills skills \
              -portfolio-review -portfolio-file "$ACCOUNT_JSON" \
              >"$OUTPUT_JSON" 2>"$STDERR_LOG"; then
            echo "::error::CLI accepted malformed account"
            exit 1
          fi
          grep -q 'decode portfolio' "$STDERR_LOG" || {
            echo "::error::Unexpected error: not input validation"
            cat "$STDERR_LOG"
            exit 1
          }
          test ! -s "$OUTPUT_JSON" || {
            echo "::error::Malformed account emitted an apparent research decision"
            exit 1
          }
          echo "Malformed account rejected before provider setup"

  live_web_api:
    name: Real Go HTTP ResearchRun with Eino providers
    if: ${{ inputs.run_live_web_api }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      DEEPSEEK_STRONG_MODEL: ${{ vars.DEEPSEEK_STRONG_MODEL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify repository credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEEPSEEK_API_KEY" || { echo "::error::DEEPSEEK_API_KEY missing"; exit 1; }
          test -n "$TUSHARE_TOKEN" || { echo "::error::TUSHARE_TOKEN missing"; exit 1; }
          test -n "$TAVILY_API_KEY" || { echo "::error::TAVILY_API_KEY missing"; exit 1; }
      - name: Prepare research dependencies and binaries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ripgrep
          go build -o "$RUNNER_TEMP/aegis-web" ./cmd/aegis-web
          go build -o "$RUNNER_TEMP/aegis-live-check" ./cmd/aegis-live-check
      - name: Run one paid ResearchRun through Go HTTP and SSE
        shell: bash
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/aegis-live-http"
          mkdir -p "$data_dir"
          chmod 700 "$data_dir"
          unset AEGIS_WEB_API_TOKEN AEGIS_CREDENTIAL_MASTER_KEY || true
          "$RUNNER_TEMP/aegis-web" \
            -dev -listen 127.0.0.1:18686 \
            -store "$data_dir/runs" \
            -credential-store "$data_dir/credentials.enc" \
            -evidence-store "$data_dir/evidence" \
            >"$data_dir/server.log" 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 120); do
            if curl -fsS --max-time 1 http://127.0.0.1:18686/api/v1/research/runs >/dev/null 2>&1; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::Go HTTP service exited before readiness"
              exit 1
            fi
            sleep 0.25
          done
          if [ "$ready" != true ]; then echo "::error::Go API not ready"; exit 1; fi
          # Do not automatically retry potentially paid requests.
          if ! "$RUNNER_TEMP/aegis-live-check" \
            -url http://127.0.0.1:18686 \
            -symbol 600519.SH -mode PORTFOLIO_REVIEW -timeout 25m -require-tool-events; then
            # Only allowlisted metadata: never dump raw provider or model logs.
            grep 'AEGIS_RUN_DIAGNOSTIC' "$data_dir/server.log" || echo "::warning::No sanitized run diagnostic found"
            exit 1
          fi
