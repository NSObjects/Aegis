name: Integration

on:
  workflow_dispatch:
    inputs:
      run_trading:
        description: "Run the Trading Agent integration test"
        required: true
        default: true
        type: boolean
      run_technical:
        description: "Run the real Technical Agent integration test"
        required: true
        default: true
        type: boolean
      run_research:
        description: "Run the full stateless production Research → Decision pipeline"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  trading:
    name: Trading Agent
    if: ${{ inputs.run_trading }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      AEGIS_INTEGRATION: "1"
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      DEEPSEEK_STRONG_MODEL: ${{ vars.DEEPSEEK_STRONG_MODEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify integration secret
        shell: bash
        run: |
          test -n "$DEEPSEEK_API_KEY" || {
            echo "::error::Repository secret DEEPSEEK_API_KEY is required"
            exit 1
          }

      - name: Run Trading Agent integration
        run: |
          go test ./internal/agent/trading \
            -run '^TestTradingAgent_Analyze_Integration$' \
            -v \
            -count=1

  technical:
    name: Technical Agent
    if: ${{ inputs.run_technical }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      AEGIS_INTEGRATION: "1"
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true


      - name: Verify integration secrets
        shell: bash
        run: |
          test -n "$DEEPSEEK_API_KEY" || {
            echo "::error::Repository secret DEEPSEEK_API_KEY is required"
            exit 1
          }
          test -n "$TUSHARE_TOKEN" || {
            echo "::error::Repository secret TUSHARE_TOKEN is required"
            exit 1
          }


      - name: Run Technical Agent integration
        run: |
          go test ./internal/agent/technical \
            -run '^TestTechnicalAgent_Analyze_Integration$' \
            -v \
            -count=1

  research:
    name: Full Stateless Hosted E2E
    if: ${{ inputs.run_research }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AEGIS_INTEGRATION: "1"
      AEGIS_FULL_STATELESS_E2E: "1"
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      DEEPSEEK_STRONG_MODEL: ${{ vars.DEEPSEEK_STRONG_MODEL }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true


      - name: Verify full E2E secrets
        shell: bash
        run: |
          test -n "$DEEPSEEK_API_KEY" || { echo "::error::Repository secret DEEPSEEK_API_KEY is required"; exit 1; }
          test -n "$TUSHARE_TOKEN" || { echo "::error::Repository secret TUSHARE_TOKEN is required"; exit 1; }
          test -n "$TAVILY_API_KEY" || { echo "::error::Repository secret TAVILY_API_KEY is required"; exit 1; }


      - name: Run full stateless hosted pipeline
        run: |
          go test ./internal/research             -run '^TestWorkflow_Run_FullStatelessHostedIntegration$'             -v             -count=1
