name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "refactor/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Go test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Hosted conversation gate static preflight (no providers)
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/verify-conversation-hosted.sh
          grep -Fq -- '-dev -portfolio-review=false -listen' scripts/verify-conversation-hosted.sh
          grep -Fq -- '"confirm_start":true' scripts/verify-conversation-hosted.sh
          grep -Fq -- 'run_conversation_hosted && !inputs.run_live_web_api' .github/workflows/integration.yml
          echo "Conversation Hosted gate syntax and DECISION mode verified without external API requests"

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: CLI account input gate (no API credentials)
        shell: bash
        run: |
          set -euo pipefail
          go build -o "${{ runner.temp }}/aegis-cli" ./cmd/aegis

          # A missing portfolio file must fail before loading config or
          # accessing any external provider; never fabricate a portfolio.
          if "${{ runner.temp }}/aegis-cli" \
              -config "${{ runner.temp }}/nonexistent-config.yaml" \
              -portfolio-review > "${{ runner.temp }}/cli-out" 2> "${{ runner.temp }}/cli-err"; then
            echo "::error::CLI accepted missing portfolio input"
            exit 1
          fi
          grep -q 'requires -portfolio-file' "${{ runner.temp }}/cli-err"
          test ! -s "${{ runner.temp }}/cli-out"

          # Reject unknown financial fields rather than dropping them.
          printf '{"state":"NOT_PROVIDED","cash":1000}\n' \
            > "${{ runner.temp }}/invalid-portfolio.json"
          if "${{ runner.temp }}/aegis-cli" \
              -config "${{ runner.temp }}/nonexistent-config.yaml" \
              -portfolio-review \
              -portfolio-file "${{ runner.temp }}/invalid-portfolio.json" \
              > "${{ runner.temp }}/cli-out" 2> "${{ runner.temp }}/cli-err"; then
            echo "::error::CLI accepted unsupported portfolio fields"
            exit 1
          fi
          grep -q 'unknown field' "${{ runner.temp }}/cli-err"
          test ! -s "${{ runner.temp }}/cli-out"

          # Existing default Decision mode must not silently use the
          # portfolio flag when portfolio-review is disabled.
          if "${{ runner.temp }}/aegis-cli" \
              -config "${{ runner.temp }}/nonexistent-config.yaml" \
              -portfolio-file "${{ runner.temp }}/invalid-portfolio.json" \
              > "${{ runner.temp }}/cli-out" 2> "${{ runner.temp }}/cli-err"; then
            echo "::error::CLI silently accepted portfolio-file without review mode"
            exit 1
          fi
          grep -q 'requires -portfolio-review' "${{ runner.temp }}/cli-err"
          test ! -s "${{ runner.temp }}/cli-out"

          # The real CLI must reject an old but structurally valid account
          # snapshot before trying to load configuration or API credentials.
          printf '{"state":"EMPTY","as_of":"2020-01-01T12:00:00+08:00"}\n' \
            > "${{ runner.temp }}/stale-portfolio.json"
          if "${{ runner.temp }}/aegis-cli" \
              -config "${{ runner.temp }}/nonexistent-config.yaml" \
              -portfolio-review \
              -portfolio-file "${{ runner.temp }}/stale-portfolio.json" \
              -portfolio-max-age 24h \
              > "${{ runner.temp }}/cli-out" 2> "${{ runner.temp }}/cli-err"; then
            echo "::error::CLI accepted stale observed portfolio snapshot"
            exit 1
          fi
          grep -q 'portfolio snapshot is stale' "${{ runner.temp }}/cli-err"
          test ! -s "${{ runner.temp }}/cli-out"

          # A caller risk policy from the future is invalid for a current
          # research cutoff. The CLI must reject it before configuration,
          # LLM initialization, or any external provider calls.
          printf '{"state":"NOT_PROVIDED"}\n' \
            > "${{ runner.temp }}/unknown-account.json"
          printf '{"policy_id":"future-risk-policy","as_of":"2099-01-01T00:00:00+08:00","scope":"CASH_AND_POSITIONS","currency":"CNY","rules":[{"kind":"MAX_SINGLE_POSITION_WEIGHT","limit_bps":3000}]}\n' \
            > "${{ runner.temp }}/future-risk-limits.json"
          if "${{ runner.temp }}/aegis-cli" \
              -config "${{ runner.temp }}/nonexistent-config.yaml" \
              -portfolio-review \
              -portfolio-file "${{ runner.temp }}/unknown-account.json" \
              -risk-limits-file "${{ runner.temp }}/future-risk-limits.json" \
              > "${{ runner.temp }}/cli-out" 2> "${{ runner.temp }}/cli-err"; then
            echo "::error::CLI accepted future policy"
            exit 1
          fi
          grep -q 'after research requested_as_of' "${{ runner.temp }}/cli-err"
          test ! -s "${{ runner.temp }}/cli-out"

          # Reject a caller scenario from the future before any provider,
          # configuration or LLM setup; do not use made-up trading orders.
          printf '{"policy_id":"test-policy","as_of":"2020-01-01T00:00:00+08:00","scope":"CASH_AND_POSITIONS","currency":"CNY","rules":[{"kind":"MAX_SINGLE_POSITION_WEIGHT","limit_bps":3000}]}\n' \
            > "${{ runner.temp }}/scenario-limits.json"
          printf '{"scenario_id":"future-what-if","as_of":"2099-01-01T00:00:00+08:00","symbol":"600519.SH","side":"BUY","currency":"CNY","notional_fen":1000}\n' \
            > "${{ runner.temp }}/future-trade-scenario.json"
          if "${{ runner.temp }}/aegis-cli" \
              -config "${{ runner.temp }}/nonexistent-config.yaml" \
              -portfolio-review \
              -portfolio-file "${{ runner.temp }}/unknown-account.json" \
              -risk-limits-file "${{ runner.temp }}/scenario-limits.json" \
              -trade-scenario-file "${{ runner.temp }}/future-trade-scenario.json" \
              > "${{ runner.temp }}/cli-out" 2> "${{ runner.temp }}/cli-err"; then
            echo "::error::CLI accepted a future proposed trade scenario"
            exit 1
          fi
          grep -q 'trade scenario as_of is after research requested_as_of' "${{ runner.temp }}/cli-err"
          test ! -s "${{ runner.temp }}/cli-out"

      - name: Local dev HTTP smoke (no auth or provider credentials)
        shell: bash
        run: bash .github/scripts/smoke-local-dev.sh
