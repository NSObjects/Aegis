default_model: default

models:
  default:
    provider: deepseek
    model: deepseek-chat
    api_key: DEEPSEEK_API_KEY

  strong:
    provider: openai
    model: gpt-5.6
    api_key: OPENAI_API_KEY

  claude:
    provider: claude
    model: claude-sonnet-4-6
    api_key: ANTHROPIC_API_KEY
    max_tokens: 8192

agents:
  trading:
    model: strong

  reflection:
    model: claude